permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'packages/google-cloud-spanner/**'
      - '.github/workflows/spanner-mockserver-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/google-cloud-spanner/**'
      - '.github/workflows/spanner-mockserver-tests.yml'

defaults:
  run:
    working-directory: packages/google-cloud-spanner

name: Run Spanner mockserver tests
jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      run_spanner: ${{ steps.filter.outputs.spanner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            spanner:
              - 'packages/google-cloud-spanner/**'
              - '.github/workflows/spanner-mockserver-tests.yml'

  mockserver-tests:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.run_spanner == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install nox
        run: python -m pip install nox
      - name: Run nox
        run: nox -s mockserver
