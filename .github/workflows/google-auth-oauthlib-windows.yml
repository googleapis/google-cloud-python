permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'packages/google-auth-oauthlib/**'
      - '.github/workflows/google-auth-oauthlib-windows.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/google-auth-oauthlib/**'
      - '.github/workflows/google-auth-oauthlib-windows.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: packages/google-auth-oauthlib

name: google-auth-oauthlib Windows Unit Tests

jobs:
  unit-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install nox
        run: python -m pip install nox

      - name: Run unit tests with nox
        run: nox -s "unit-${{ matrix.python }}"
