[pytest]
# The data client system tests share a single client across the whole session
# (see the session-scoped `client`/`target`/`table` fixtures), so every async
# fixture and test must run on the same event loop. Run them all on a single
# session-scoped loop, matching the previous session-scoped `event_loop`
# override that pytest-asyncio removed in 1.0.
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
