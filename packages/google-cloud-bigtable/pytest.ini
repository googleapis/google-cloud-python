[pytest]
# --- asyncio event-loop scoping -------------------------------------------
# The system-test suites (tests/system/**) share session-scoped async
# client/table fixtures across the tests in a class -- see
# tests/system/conftest.py and e.g. tests/system/data/test_system_async.py and
# tests/system/data/accelerator/_base_async.py. A session-scoped async fixture
# and the tests that use it must run on the *same* event loop, otherwise the
# grpc.aio call created in the fixture's loop is awaited from the test's loop and
# raises "got Future <...> attached to a different loop".
#
# pytest-asyncio <=0.21 enforced a single loop via the session-scoped
# ``event_loop`` fixture override in tests/system/conftest.py. pytest-asyncio
# >=0.23 ignores that override and instead reads the loop scope from these two
# options (default: function). Pinning both to "session" preserves the
# single-loop behavior on modern pytest-asyncio; older versions ignore these
# keys (harmless "Unknown config option" warning) and keep using the override.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
