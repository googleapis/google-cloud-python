[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-cloud-spanner-arrow"
version = "0.1.0"
description = "High-performance Apache Arrow accelerator for Google Cloud Spanner"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "pyarrow >= 14.0.0",
]
