[metadata]
name = google-cloud-spanner-arrow
version = 0.1.0
description = High-performance Apache Arrow accelerator for Google Cloud Spanner
url = https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-spanner-arrow
long_description = file: README.md
long_description_content_type = text/markdown
author = Google LLC
author_email = googleapis-packages@google.com

license = Apache 2.0
license_files = LICENSE
platforms = Posix, MacOS X, Windows
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14

[options]
zip_safe = False
python_requires = >=3.10
install_requires =
    pyarrow >= 14.0.0

[options.extras_require]
testing =
    pytest

[options.package_data]
google_cloud_spanner_arrow =
    py.typed
