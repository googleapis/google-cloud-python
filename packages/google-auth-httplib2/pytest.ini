[pytest]
filterwarnings =
    # treat all warnings as errors
    error
    ignore:.*Please upgrade to the latest Python version.*:FutureWarning
    ignore:(?s).*using a Python version.*past its end of life.*:FutureWarning
    ignore:.*asyncio_default_fixture_loop_scope.*:pytest.PytestDeprecationWarning
    ignore:.*Module-scoped fixtures defined as instance methods are deprecated.*:pytest.PytestDeprecationWarning
