[pytest]
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # treat all warnings as errors
    error
    # Remove once release PR https://github.com/googleapis/python-api-common-protos/pull/191 is merged
    ignore:.*pkg_resources.declare_namespace:DeprecationWarning
    ignore:.*pkg_resources is deprecated as an API:DeprecationWarning
    # Remove once https://github.com/protocolbuffers/protobuf/issues/12186 is fixed
    ignore:.*custom tp_new.*in Python 3.14:DeprecationWarning
    # This warning is expected for Python versions that approach EOL
    ignore:.*Please upgrade to the latest Python version.*:FutureWarning
    ignore:(?s).*using a Python version.*past its end of life.*:FutureWarning
