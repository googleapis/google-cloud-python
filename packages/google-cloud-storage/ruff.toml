target-version = "py310"
line-length = 88

# Generated code is maintained by the GAPIC generator.
# force-exclude also applies when a file is passed explicitly.
force-exclude = true
extend-exclude = [
    "google/cloud/_storage",
    "google/cloud/_storage_v2",
    "samples/generated_samples",
    "tests/unit/gapic",
]

[lint]
# Sort imports and modernize Python syntax. Flake8 continues to check code
# quality in the lint session.
select = ["I", "UP"]
