substitutions:
  _ZONE: "us-west4-a"
  _VM_NAME: "shradhakatyal-benchmarks-us-west4-a"
  _ULIMIT: "65536"
  _PROCESSES: "48"
  _COROS: "1"
  _FILE_SIZE_MIB: "10240"
  _CHUNK_SIZE_KIB: "102400"
  _ZONAL_BUCKET: "shradhakatyal-read-bench-zb-us-west4-a"

steps:
  # Step 0: Generate a persistent SSH key for this build run.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "generate-ssh-key"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        mkdir -p /workspace/.ssh
        ssh-keygen -t rsa -f /workspace/.ssh/google_compute_engine -N '' -C gcb
        cat /workspace/.ssh/google_compute_engine.pub > /workspace/gcb_ssh_key.pub
        gcloud compute os-login ssh-keys add \
          --key-file=/workspace/.ssh/google_compute_engine.pub \
          --ttl=1h
    waitFor: ["-"]

  # Step 1: Package google-cloud-storage directory for direct transfer to VM
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "package-code"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        tar --exclude='.nox' --exclude='venv_*' --exclude='.pytest_cache' --exclude='__pycache__' --exclude='.git' -czf /workspace/google-cloud-storage.tar.gz -C /workspace/packages google-cloud-storage
    waitFor: ["-"]

  # Step 2: Run the read microbenchmark suite inside the standing GCE VM via SSH.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "run-tests-on-vm"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        # Verify SSH connectivity to existing standing VM
        for i in {1..6}; do
          if gcloud compute ssh "${_VM_NAME}" --zone=${_ZONE} --internal-ip --ssh-key-file=/workspace/.ssh/google_compute_engine --command="echo VM is ready"; then
            break
          fi
          echo "Waiting for VM connectivity... (attempt $i/6)"
          sleep 10
        done

        # Copy runner script and tarball to the standing VM
        gcloud compute scp packages/google-cloud-storage/cloudbuild/run_benchmark_tests.sh /workspace/google-cloud-storage.tar.gz "${_VM_NAME}":~ --zone=${_ZONE} --internal-ip --ssh-key-file=/workspace/.ssh/google_compute_engine

        # Execute run_benchmark_tests.sh on the VM via SSH
        gcloud compute ssh "${_VM_NAME}" --zone=${_ZONE} --internal-ip --ssh-key-file=/workspace/.ssh/google_compute_engine \
          --command="ulimit -n ${_ULIMIT}; tar -xzf google-cloud-storage.tar.gz && cp run_benchmark_tests.sh google-cloud-storage/ && cd google-cloud-storage && PROCESSES=${_PROCESSES} COROS=${_COROS} FILE_SIZE_MIB=${_FILE_SIZE_MIB} CHUNK_SIZE_KIB=${_CHUNK_SIZE_KIB} TARGET_BUCKET=${_ZONAL_BUCKET} bash run_benchmark_tests.sh"
    waitFor:
      - "generate-ssh-key"
      - "package-code"

  # Step 3: Cleanup temporary OS Login SSH key
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "cleanup-ssh-key"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "--- Removing SSH key from OS Login profile ---"
        gcloud compute os-login ssh-keys remove \
          --key-file=/workspace/gcb_ssh_key.pub || true
    waitFor:
      - "run-tests-on-vm"

timeout: "3600s" # 60 minutes

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
