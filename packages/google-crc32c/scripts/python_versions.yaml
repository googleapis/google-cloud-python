# Single source of truth for supported Python versions across CI and release builds.
#
# Use full 3-part versions. They must correspond to a real CPython release, since
# macOS downloads the matching official installer from
# https://www.python.org/ftp/python/<version>/python-<version>-macos11.pkg
# and Windows installs the matching Chocolatey package.
# Linux (manylinux) and the wheel ABI tags only use the major.minor part.
