tests:
  - description: "testAddWindowFields - partition, sort, documents frame, and multiple accumulators"
    pipeline:
      - Collection: books
      - Where:
          - FunctionExpression.equal_any:
              - Field: genre
              - [Science Fiction, Dystopian]
      - AddWindowFields:
          window:
            WindowSpec:
              partition:
                - Field: genre
              sort:
                - Ordering:
                    - Field: published
                    - ASCENDING
              frame:
                DocumentWindowFrame:
                  preceding: unbounded
                  following: current
          fields:
            - AliasedExpression:
                - FunctionExpression.sum:
                    - Field: rating
                - "running_rating"
            - AliasedExpression:
                - Count
                - "running_count"
      - Sort:
          - Ordering:
              - Field: published
              - ASCENDING
      - Select:
          - title
          - genre
          - running_rating
          - running_count
    assert_results:
      - title: "1984"
        genre: "Dystopian"
        running_rating: 4.2
        running_count: 1
      - title: "Dune"
        genre: "Science Fiction"
        running_rating: 4.6
        running_count: 1
      - title: "The Hitchhiker's Guide to the Galaxy"
        genre: "Science Fiction"
        running_rating: 8.8
        running_count: 2
      - title: "The Handmaid's Tale"
        genre: "Dystopian"
        running_rating: 8.3
        running_count: 2
    assert_proto:
      pipeline:
        stages:
        - args:
          - referenceValue: /books
          name: collection
        - args:
          - functionValue:
              args:
              - fieldReferenceValue: genre
              - functionValue:
                  args:
                  - stringValue: Science Fiction
                  - stringValue: Dystopian
                  name: array
              name: equal_any
          name: where
        - args:
          - mapValue:
              fields:
                documents:
                  mapValue:
                    fields:
                      following:
                        stringValue: current
                      preceding:
                        stringValue: unbounded
                partition:
                  arrayValue:
                    values:
                    - fieldReferenceValue: genre
                sort:
                  arrayValue:
                    values:
                    - mapValue:
                        fields:
                          direction:
                            stringValue: ascending
                          expression:
                            fieldReferenceValue: published
          - mapValue:
              fields:
                running_count:
                  functionValue:
                    name: count
                running_rating:
                  functionValue:
                    args:
                    - fieldReferenceValue: rating
                    name: sum
          name: add_window_fields
        - args:
          - mapValue:
              fields:
                direction:
                  stringValue: ascending
                expression:
                  fieldReferenceValue: published
          name: sort
        - args:
          - mapValue:
              fields:
                genre:
                  fieldReferenceValue: genre
                running_count:
                  fieldReferenceValue: running_count
                running_rating:
                  fieldReferenceValue: running_rating
                title:
                  fieldReferenceValue: title
          name: select
  - description: "testAddWindowFields - documents frame with numeric offsets"
    pipeline:
      - Collection: books
      - Where:
          - FunctionExpression.less_than:
              - Field: published
              - 1950
      - AddWindowFields:
          window:
            WindowSpec:
              sort:
                - Ordering:
                    - Field: published
                    - ASCENDING
              frame:
                DocumentWindowFrame:
                  preceding: 1
                  following: 1
          fields:
            - AliasedExpression:
                - Count
                - "window_count"
            - AliasedExpression:
                - FunctionExpression.maximum:
                    - Field: published
                - "max_published"
      - Sort:
          - Ordering:
              - Field: published
              - ASCENDING
      - Select:
          - title
          - window_count
          - max_published
    assert_results:
      - title: "Pride and Prejudice"
        window_count: 2
        max_published: 1866
      - title: "Crime and Punishment"
        window_count: 3
        max_published: 1925
      - title: "The Great Gatsby"
        window_count: 3
        max_published: 1949
      - title: "1984"
        window_count: 2
        max_published: 1949
    assert_proto:
      pipeline:
        stages:
        - args:
          - referenceValue: /books
          name: collection
        - args:
          - functionValue:
              args:
              - fieldReferenceValue: published
              - integerValue: '1950'
              name: less_than
          name: where
        - args:
          - mapValue:
              fields:
                documents:
                  mapValue:
                    fields:
                      following:
                        integerValue: '1'
                      preceding:
                        integerValue: '1'
                sort:
                  arrayValue:
                    values:
                    - mapValue:
                        fields:
                          direction:
                            stringValue: ascending
                          expression:
                            fieldReferenceValue: published
          - mapValue:
              fields:
                max_published:
                  functionValue:
                    args:
                    - fieldReferenceValue: published
                    name: maximum
                window_count:
                  functionValue:
                    name: count
          name: add_window_fields
        - args:
          - mapValue:
              fields:
                direction:
                  stringValue: ascending
                expression:
                  fieldReferenceValue: published
          name: sort
        - args:
          - mapValue:
              fields:
                max_published:
                  fieldReferenceValue: max_published
                title:
                  fieldReferenceValue: title
                window_count:
                  fieldReferenceValue: window_count
          name: select
  - description: "testAddWindowFields - rank with ties"
    pipeline:
      - Collection: books
      - Where:
          - FunctionExpression.equal_any:
              - Field: genre
              - [Science Fiction, Dystopian]
      - AddWindowFields:
          window:
            WindowSpec:
              sort:
                - Ordering:
                    - Field: rating
                    - ASCENDING
          fields:
            - AliasedExpression:
                - Rank
                - "rating_rank"
      - Sort:
          - Ordering:
              - Field: rating
              - ASCENDING
          - Ordering:
              - Field: title
              - ASCENDING
      - Select:
          - title
          - rating
          - rating_rank
    assert_results:
      - title: "The Handmaid's Tale"
        rating: 4.1
        rating_rank: 1
      - title: "1984"
        rating: 4.2
        rating_rank: 2
      - title: "The Hitchhiker's Guide to the Galaxy"
        rating: 4.2
        rating_rank: 2
      - title: "Dune"
        rating: 4.6
        rating_rank: 4
    assert_proto:
      pipeline:
        stages:
        - args:
          - referenceValue: /books
          name: collection
        - args:
          - functionValue:
              args:
              - fieldReferenceValue: genre
              - functionValue:
                  args:
                  - stringValue: Science Fiction
                  - stringValue: Dystopian
                  name: array
              name: equal_any
          name: where
        - args:
          - mapValue:
              fields:
                sort:
                  arrayValue:
                    values:
                    - mapValue:
                        fields:
                          direction:
                            stringValue: ascending
                          expression:
                            fieldReferenceValue: rating
          - mapValue:
              fields:
                rating_rank:
                  functionValue:
                    name: rank
          name: add_window_fields
        - args:
          - mapValue:
              fields:
                direction:
                  stringValue: ascending
                expression:
                  fieldReferenceValue: rating
          - mapValue:
              fields:
                direction:
                  stringValue: ascending
                expression:
                  fieldReferenceValue: title
          name: sort
        - args:
          - mapValue:
              fields:
                rating:
                  fieldReferenceValue: rating
                rating_rank:
                  fieldReferenceValue: rating_rank
                title:
                  fieldReferenceValue: title
          name: select
  - description: "testAddWindowFields - partition with aggregate functions"
    pipeline:
      - Collection: books
      - Where:
          - FunctionExpression.equal_any:
              - Field: genre
              - [Science Fiction, Dystopian]
      - AddWindowFields:
          window:
            WindowSpec:
              partition:
                - genre
          fields:
            - AliasedExpression:
                - Count
                - "genre_count"
            - AliasedExpression:
                - FunctionExpression.average:
                    - Field: rating
                - "genre_avg_rating"
      - Sort:
          - Ordering:
              - Field: published
              - ASCENDING
      - Select:
          - title
          - genre
          - genre_count
          - genre_avg_rating
    assert_results:
      - title: "1984"
        genre: "Dystopian"
        genre_count: 2
        genre_avg_rating: 4.15
      - title: "Dune"
        genre: "Science Fiction"
        genre_count: 2
        genre_avg_rating: 4.4
      - title: "The Hitchhiker's Guide to the Galaxy"
        genre: "Science Fiction"
        genre_count: 2
        genre_avg_rating: 4.4
      - title: "The Handmaid's Tale"
        genre: "Dystopian"
        genre_count: 2
        genre_avg_rating: 4.15
    assert_proto:
      pipeline:
        stages:
        - args:
          - referenceValue: /books
          name: collection
        - args:
          - functionValue:
              args:
              - fieldReferenceValue: genre
              - functionValue:
                  args:
                  - stringValue: Science Fiction
                  - stringValue: Dystopian
                  name: array
              name: equal_any
          name: where
        - args:
          - mapValue:
              fields:
                partition:
                  arrayValue:
                    values:
                    - fieldReferenceValue: genre
          - mapValue:
              fields:
                genre_avg_rating:
                  functionValue:
                    args:
                    - fieldReferenceValue: rating
                    name: average
                genre_count:
                  functionValue:
                    name: count
          name: add_window_fields
        - args:
          - mapValue:
              fields:
                direction:
                  stringValue: ascending
                expression:
                  fieldReferenceValue: published
          name: sort
        - args:
          - mapValue:
              fields:
                genre:
                  fieldReferenceValue: genre
                genre_avg_rating:
                  fieldReferenceValue: genre_avg_rating
                genre_count:
                  fieldReferenceValue: genre_count
                title:
                  fieldReferenceValue: title
          name: select
