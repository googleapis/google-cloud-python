tests:
  - description: "testAddWindowFields - rank with ties"
    pipeline:
      - Collection: books
      - Where:
          - FunctionExpression.equal_any:
              - Field: genre
              - [Science Fiction, Dystopian]
      - AddWindowFields:
          window:
            WindowSpec:
              sort:
                - Ordering:
                    - Field: rating
                    - ASCENDING
          fields:
            - AliasedExpression:
                - Rank
                - "rating_rank"
      - Sort:
          - Ordering:
              - Field: rating
              - ASCENDING
          - Ordering:
              - Field: title
              - ASCENDING
      - Select:
          - title
          - rating
          - rating_rank
    assert_results:
      - title: "The Handmaid's Tale"
        rating: 4.1
        rating_rank: 1
      - title: "1984"
        rating: 4.2
        rating_rank: 2
      - title: "The Hitchhiker's Guide to the Galaxy"
        rating: 4.2
        rating_rank: 2
      - title: "Dune"
        rating: 4.6
        rating_rank: 4
    assert_proto:
      pipeline:
        stages:
        - args:
          - referenceValue: /books
          name: collection
        - args:
          - functionValue:
              args:
              - fieldReferenceValue: genre
              - functionValue:
                  args:
                  - stringValue: Science Fiction
                  - stringValue: Dystopian
                  name: array
              name: equal_any
          name: where
        - args:
          - mapValue:
              fields:
                sort:
                  arrayValue:
                    values:
                    - mapValue:
                        fields:
                          direction:
                            stringValue: ascending
                          expression:
                            fieldReferenceValue: rating
          - mapValue:
              fields:
                rating_rank:
                  functionValue:
                    name: rank
          name: add_window_fields
        - args:
          - mapValue:
              fields:
                direction:
                  stringValue: ascending
                expression:
                  fieldReferenceValue: rating
          - mapValue:
              fields:
                direction:
                  stringValue: ascending
                expression:
                  fieldReferenceValue: title
          name: sort
        - args:
          - mapValue:
              fields:
                rating:
                  fieldReferenceValue: rating
                rating_rank:
                  fieldReferenceValue: rating_rank
                title:
                  fieldReferenceValue: title
          name: select
  - description: "testAddWindowFields - partition with aggregate functions"
    pipeline:
      - Collection: books
      - Where:
          - FunctionExpression.equal_any:
              - Field: genre
              - [Science Fiction, Dystopian]
      - AddWindowFields:
          window:
            WindowSpec:
              partition:
                - genre
          fields:
            - AliasedExpression:
                - Count
                - "genre_count"
            - AliasedExpression:
                - FunctionExpression.average:
                    - Field: rating
                - "genre_avg_rating"
      - Sort:
          - Ordering:
              - Field: published
              - ASCENDING
      - Select:
          - title
          - genre
          - genre_count
          - genre_avg_rating
    assert_results:
      - title: "1984"
        genre: "Dystopian"
        genre_count: 2
        genre_avg_rating: 4.15
      - title: "Dune"
        genre: "Science Fiction"
        genre_count: 2
        genre_avg_rating: 4.4
      - title: "The Hitchhiker's Guide to the Galaxy"
        genre: "Science Fiction"
        genre_count: 2
        genre_avg_rating: 4.4
      - title: "The Handmaid's Tale"
        genre: "Dystopian"
        genre_count: 2
        genre_avg_rating: 4.15
    assert_proto:
      pipeline:
        stages:
        - args:
          - referenceValue: /books
          name: collection
        - args:
          - functionValue:
              args:
              - fieldReferenceValue: genre
              - functionValue:
                  args:
                  - stringValue: Science Fiction
                  - stringValue: Dystopian
                  name: array
              name: equal_any
          name: where
        - args:
          - mapValue:
              fields:
                partition:
                  arrayValue:
                    values:
                    - fieldReferenceValue: genre
          - mapValue:
              fields:
                genre_avg_rating:
                  functionValue:
                    args:
                    - fieldReferenceValue: rating
                    name: average
                genre_count:
                  functionValue:
                    name: count
          name: add_window_fields
        - args:
          - mapValue:
              fields:
                direction:
                  stringValue: ascending
                expression:
                  fieldReferenceValue: published
          name: sort
        - args:
          - mapValue:
              fields:
                genre:
                  fieldReferenceValue: genre
                genre_avg_rating:
                  fieldReferenceValue: genre_avg_rating
                genre_count:
                  fieldReferenceValue: genre_count
                title:
                  fieldReferenceValue: title
          name: select
  - description: "testAddWindowFields - partition and sort default running window"
    pipeline:
      - Collection: books
      - Where:
          - FunctionExpression.equal_any:
              - Field: genre
              - [Science Fiction, Dystopian]
      - AddWindowFields:
          window:
            WindowSpec:
              partition:
                - genre
              sort:
                - Ordering:
                    - Field: published
                    - ASCENDING
          fields:
            - AliasedExpression:
                - Count
                - "running_count"
      - Sort:
          - Ordering:
              - Field: published
              - ASCENDING
      - Select:
          - title
          - genre
          - running_count
    assert_results:
      - title: "1984"
        genre: "Dystopian"
        running_count: 1
      - title: "Dune"
        genre: "Science Fiction"
        running_count: 1
      - title: "The Hitchhiker's Guide to the Galaxy"
        genre: "Science Fiction"
        running_count: 2
      - title: "The Handmaid's Tale"
        genre: "Dystopian"
        running_count: 2
    assert_proto:
      pipeline:
        stages:
        - args:
          - referenceValue: /books
          name: collection
        - args:
          - functionValue:
              args:
              - fieldReferenceValue: genre
              - functionValue:
                  args:
                  - stringValue: Science Fiction
                  - stringValue: Dystopian
                  name: array
              name: equal_any
          name: where
        - args:
          - mapValue:
              fields:
                partition:
                  arrayValue:
                    values:
                    - fieldReferenceValue: genre
                sort:
                  arrayValue:
                    values:
                    - mapValue:
                        fields:
                          direction:
                            stringValue: ascending
                          expression:
                            fieldReferenceValue: published
          - mapValue:
              fields:
                running_count:
                  functionValue:
                    name: count
          name: add_window_fields
        - args:
          - mapValue:
              fields:
                direction:
                  stringValue: ascending
                expression:
                  fieldReferenceValue: published
          name: sort
        - args:
          - mapValue:
              fields:
                genre:
                  fieldReferenceValue: genre
                running_count:
                  fieldReferenceValue: running_count
                title:
                  fieldReferenceValue: title
          name: select
  - description: "testAddWindowFields - error on rank() without sort"
    pipeline:
      - Collection: books
      - AddWindowFields:
          window:
            WindowSpec:
              partition:
                - genre
          fields:
            - AliasedExpression:
                - Rank
                - "genre_rank"
    assert_error: ".*sort.*"
