  - description: "testAddWindowFields - error on rank() without sort"
    pipeline:
      - Collection: books
      - AddWindowFields:
          window:
            WindowSpec:
              partition:
                - genre
          fields:
            - AliasedExpression:
                - Rank
                - "genre_rank"
    assert_error: ".*sort.*"
