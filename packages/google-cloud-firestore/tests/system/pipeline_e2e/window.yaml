tests:
  - description: "testAddWindowFields - rank with ties"
    pipeline:
      - Collection: books
      - Where:
          - FunctionExpression.equal_any:
              - Field: genre
              - [Science Fiction, Dystopian]
      - AddWindowFields:
          window:
            WindowSpec:
              sort:
                - Ordering:
                    - Field: rating
                    - ASCENDING
          fields:
            - AliasedExpression:
                - Rank
                - "rating_rank"
      - Sort:
          - Ordering:
              - Field: rating
              - ASCENDING
          - Ordering:
              - Field: title
              - ASCENDING
      - Select:
          - title
          - rating
          - rating_rank
    assert_results:
      - title: "The Handmaid's Tale"
        rating: 4.1
        rating_rank: 1
      - title: "1984"
        rating: 4.2
        rating_rank: 2
      - title: "The Hitchhiker's Guide to the Galaxy"
        rating: 4.2
        rating_rank: 2
      - title: "Dune"
        rating: 4.6
        rating_rank: 4
    assert_proto:
      pipeline:
        stages:
        - args:
          - referenceValue: /books
          name: collection
        - args:
          - functionValue:
              args:
              - fieldReferenceValue: genre
              - functionValue:
                  args:
                  - stringValue: Science Fiction
                  - stringValue: Dystopian
                  name: array
              name: equal_any
          name: where
        - args:
          - mapValue:
              fields:
                sort:
                  arrayValue:
                    values:
                    - mapValue:
                        fields:
                          direction:
                            stringValue: ascending
                          expression:
                            fieldReferenceValue: rating
          - mapValue:
              fields:
                rating_rank:
                  functionValue:
                    name: rank
          name: add_window_fields
        - args:
          - mapValue:
              fields:
                direction:
                  stringValue: ascending
                expression:
                  fieldReferenceValue: rating
          - mapValue:
              fields:
                direction:
                  stringValue: ascending
                expression:
                  fieldReferenceValue: title
          name: sort
        - args:
          - mapValue:
              fields:
                rating:
                  fieldReferenceValue: rating
                rating_rank:
                  fieldReferenceValue: rating_rank
                title:
                  fieldReferenceValue: title
          name: select
