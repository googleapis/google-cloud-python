steps:
  - name: 'us-central1-docker.pkg.dev/client-library-releases/release-images-prod/python-multi@sha256:d529954c373542171f9fc411e0102cebe542b511e320a965edf8820285f4f122'
    id: 'run-system-tests-shard'
    secretEnv:
      - 'GAPIC_GENERATOR_ADS_ENV'
      - 'GAPIC_GENERATOR_SERVICE_ACCOUNT_JSON'
      - 'GOOGLE_AUTH_SERVICE_ACCOUNT_JSON'
      - 'GOOGLE_AUTH_AUTHORIZED_USER_JSON'
    env:
      # Populate standard GCP project and CI environment variables expected by system test suites.
      - 'CI=true'
      - 'PIP_BREAK_SYSTEM_PACKAGES=1'
      - 'UV_VENV_SEED=1'
      - 'RUN_COMPLIANCE_TESTS=false'
      - 'GOOGLE_CLOUD_PROJECT=${PROJECT_ID}'
      - 'GCLOUD_PROJECT=${PROJECT_ID}'
      - 'PROJECT_ID=${PROJECT_ID}'
      # Cloud Build built-ins used by ci/cancel_superseded_builds.py to cancel outdated PR runs.
      - 'LOCATION=${LOCATION}'
      - 'BUILD_ID=${BUILD_ID}'
      - 'FIRESTORE_PROJECT_ID=${_FIRESTORE_PROJECT_ID}'
      # Pass sharding and diff parameters consumed by ci/get_package_shards.py.
      - 'MAX_SHARDS=${_MAX_SHARDS}'
      - 'SHARD_INDEX=${_SHARD_INDEX}'
      - 'MIN_SHARD_WEIGHT=${_MIN_SHARD_WEIGHT}'
      - 'BUILD_TYPE=${_BUILD_TYPE}'
      - 'TARGET_BRANCH=${_BASE_BRANCH}'
      - 'TEST_ALL_PACKAGES=${_TEST_ALL_PACKAGES}'
      - 'DISABLED_PACKAGES=${_DISABLED_PACKAGES}'
      - 'PACKAGE_WEIGHTS=${_PACKAGE_WEIGHTS}'
      # Specify the nox session consumed by ci/run_conditional_tests.sh and ci/run_single_test.sh.
      - 'NOX_SESSION=${_NOX_SESSION}'
      - 'TEST_TYPE=${_NOX_SESSION}'
      # Configure parallel package execution, time budget/threshold, and unbuffered Python output.
      - 'PARALLEL_WORKERS=${_PARALLEL_WORKERS}'
      - 'CONTINUE_ON_ERROR=true'
      - 'TIME_BUDGET_MINUTES=${_TIME_BUDGET_MINUTES}'
      - 'HARD_TIMEOUT_MINUTES=${_HARD_TIMEOUT_MINUTES}'
      - 'PYTHONUNBUFFERED=1'
    script: |
      #!/usr/bin/env bash
      set -eo pipefail

      # Cancel any older QUEUED/WORKING builds for this PR and shard so newer pushes
      # immediately take precedence instead of piling up in the Cloud Build queue.
      python3 ci/cancel_superseded_builds.py --cancel-older || true

      # Derive PY_VERSION (e.g. "3.12" from "system-3.12") required by ci/run_single_test.sh.
      export PY_VERSION="${NOX_SESSION#system-}"

      # Deepen both the checked-out PR commit and target branch history so git diff in
      # ci/get_package_shards.py finds the merge base in Cloud Build's shallow checkout,
      # and populate local refs/heads/${TARGET_BRANCH} so ci/run_conditional_tests.sh's
      # local insteadOf fetch succeeds silently.
      git fetch --no-tags --quiet origin \
        "$(git rev-parse HEAD)" \
        "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" \
        "+refs/heads/${TARGET_BRANCH}:refs/heads/${TARGET_BRANCH}" \
        --depth=200 || true

      # Import ci/get_package_shards.py without modifying the script on disk.
      # Filter get_packages() in memory to exclude _DISABLED_PACKAGES.
      PACKAGE_LIST=$(python3 -c '
      import os
      import sys

      sys.path.insert(0, "ci")
      import get_package_shards

      # Normalize disabled package paths by stripping trailing slashes.
      disabled_packages = {
          package_path.strip().rstrip("/")
          for package_path in os.environ.get("DISABLED_PACKAGES", "").replace(",", " ").split()
          if package_path.strip()
      }

      def has_system_tests(package_path):
          normalized = package_path.strip().rstrip("/")
          return normalized.startswith("packages/") and any(
              os.path.exists(os.path.join(normalized, rel_path))
              for rel_path in (
                  "tests/system",
                  "tests/system_live",
                  "system_tests",
                  "tests/system.py",
              )
          )

      original_get_packages = get_package_shards.get_packages
      def filtered_get_packages(*args, **kwargs):
          filtered_packages = {}
          for package_name, package_paths in original_get_packages(
              handwritten_only=False
          ).items():
              # Keep only packages/ paths with system tests that are NOT in disabled_packages
              kept_paths = [
                  path
                  for path in package_paths
                  if path.strip().rstrip("/") not in disabled_packages
                  and has_system_tests(path)
              ]
              if kept_paths:
                  filtered_packages[package_name] = kept_paths
          return filtered_packages

      get_package_shards.get_packages = filtered_get_packages

      # Compute the packages that need testing and distribute them across balanced shards.
      packages_to_test = get_package_shards.get_packages_to_test()
      shards = get_package_shards.group_packages(packages_to_test)

      shard_index = int(os.environ.get("SHARD_INDEX", "0"))
      print(shards[shard_index].get("packages", "") if shard_index < len(shards) else "")
      ')

      # Report immediate green (< 10s) if no packages in this PR map to this shard index.
      if [[ -z "${PACKAGE_LIST}" ]]; then
        echo "No packages assigned to shard ${SHARD_INDEX}. Exiting 0."
        exit 0
      fi

      # Install uv so nox sessions use fast cached wheel installation instead of slow virtualenv + pip.
      python3 -m pip install --quiet uv || true

      # Create runtime shims in /tmp/cloudbuild_shims so tracked repository files remain unmodified.
      mkdir -p /tmp/cloudbuild_shims

      # 1. Python startup hook (sitecustomize.py) & Pytest plugin (cloudbuild_pytest_plugin.py):
      #    - Package noxfile.py files skip the system session if GOOGLE_APPLICATION_CREDENTIALS
      #      is unset. We export a placeholder value ("CLOUD_BUILD_ADC") to satisfy noxfile.py,
      #      then remove it in sitecustomize.py for every non-nox Python subprocess (such as
      #      sqlalchemy-spanner's create_test_database.py and pytest) so google.auth.default()
      #      uses the Cloud Build worker VM's Application Default Credentials (ADC).
      #    - Package noxfile.py files invoke `py.test --quiet`, which only outputs dots (".")
      #      without newlines and causes Cloud Build logs to appear frozen for several minutes.
      #      Overriding `quiet = 0` and `verbose = 1` makes pytest print one newline-terminated
      #      status line as each individual test finishes.
      cat << 'EOF' > /tmp/cloudbuild_shims/sitecustomize.py
      import os
      import sys

      if (
          os.environ.get("GOOGLE_APPLICATION_CREDENTIALS") == "CLOUD_BUILD_ADC"
          and os.path.basename(sys.argv[0]) != "nox"
      ):
          os.environ.pop("GOOGLE_APPLICATION_CREDENTIALS", None)
      EOF

      cat << 'EOF' > /tmp/cloudbuild_shims/cloudbuild_pytest_plugin.py
      import os

      if os.environ.get("GOOGLE_APPLICATION_CREDENTIALS") == "CLOUD_BUILD_ADC":
          os.environ.pop("GOOGLE_APPLICATION_CREDENTIALS", None)


      def pytest_configure(config):
          config.option.quiet = 0
          config.option.verbose = max(config.option.verbose, 1)
      EOF

      # 2. Nox wrapper (/tmp/cloudbuild_shims/nox):
      #    - When PARALLEL_WORKERS > 1, `ci/run_conditional_tests.sh` redirects each worker's
      #      stdout/stderr (file descriptors 1 and 2) to a temporary log file, which otherwise
      #      produces no console output until the entire package finishes.
      #    - Before invoking `ci/run_conditional_tests.sh`, we duplicate the container's live
      #      stdout to file descriptor 3 (`exec 3>&1`). This wrapper streams every output line
      #      prefixed with `[<package_name>]` directly to file descriptor 3 in real time while
      #      also saving the raw output to a temporary file (`TEMP_LOG_FILE`).
      #    - At completion, it calculates how much of the per-package time budget was used
      #      (e.g., 18 minutes out of a 20-minute budget = 90%) and logs the summary.
      #    - If the nox session fails, it outputs the `=== FAILURES ===` section to stdout so
      #      `ci/run_conditional_tests.sh` prints a clean failure summary at the end of the run.
      cat << 'EOF' > /tmp/cloudbuild_shims/nox
      #!/usr/bin/env bash
      PACKAGE_NAME=$(basename "$PWD")
      REAL_NOX=$(which -a nox | grep -v '/tmp/cloudbuild_shims' | head -n 1)
      TEMP_LOG_FILE=$(mktemp)
      START_TIME=$(date +%s)
      NOX_ARGS=("$@")

      # Per-package setup for google-cloud-firestore, google-auth, and gapic-generator.
      if [[ "${PACKAGE_NAME}" == "google-cloud-firestore" && -n "${FIRESTORE_PROJECT_ID:-}" ]]; then
        export GOOGLE_CLOUD_PROJECT="${FIRESTORE_PROJECT_ID}"
        export GCLOUD_PROJECT="${FIRESTORE_PROJECT_ID}"
      elif [[ "${PACKAGE_NAME}" == "google-auth" ]]; then
        mkdir -p system_tests/data
        printf '%s' "${GOOGLE_AUTH_SERVICE_ACCOUNT_JSON}" > system_tests/data/service_account.json
        printf '%s' "${GOOGLE_AUTH_AUTHORIZED_USER_JSON}" > system_tests/data/authorized_user.json
        export GOOGLE_APPLICATION_CREDENTIALS="${PWD}/system_tests/data/service_account.json"
        NOX_ARGS=(--stop-on-first-error -f system_tests/noxfile.py)
      elif [[ "${PACKAGE_NAME}" == "gapic-generator" ]]; then
        ADS_ENV_FILE=$(mktemp)
        ADS_SA_FILE=$(mktemp --suffix=.json)
        trap 'rm -f "${ADS_ENV_FILE}" "${ADS_SA_FILE}" "${TEMP_LOG_FILE}"' EXIT
        printf '%s\n' "${GAPIC_GENERATOR_ADS_ENV}" > "${ADS_ENV_FILE}"
        printf '%s' "${GAPIC_GENERATOR_SERVICE_ACCOUNT_JSON}" > "${ADS_SA_FILE}"
        set -a
        source "${ADS_ENV_FILE}"
        set +a
        rm -f "${ADS_ENV_FILE}"
        export GOOGLE_APPLICATION_CREDENTIALS="${ADS_SA_FILE}"
        export GOOGLE_ADS_VIDEO_PATH="/tmp/gapic_generator_test_video.mp4"
        if [[ ! -f "${GOOGLE_ADS_VIDEO_PATH}" ]]; then
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -y -loglevel error -f lavfi -i testsrc=duration=8:size=1280x720:rate=30 -c:v libx264 -b:v 1M -pix_fmt yuv420p "${GOOGLE_ADS_VIDEO_PATH}"
          else
            python3 -c '
      import os, struct
      ftyp = struct.pack(">I4s4sI4s", 20, b"ftyp", b"isom", 512, b"isom")
      pad = b"\x00" * (600 * 1024)
      free = struct.pack(">I4s", 8 + len(pad), b"free") + pad
      open(os.environ["GOOGLE_ADS_VIDEO_PATH"], "wb").write(ftyp + free)
      '
          fi
        fi
      fi

      echo "[${PACKAGE_NAME}] Starting nox ${NOX_ARGS[*]}" >&3
      "$REAL_NOX" "${NOX_ARGS[@]}" 2>&1 | python3 -u -c '
      import os, sys
      prefix = f"[{sys.argv[1]}] "
      with open(sys.argv[2], "w", buffering=1) as log_f, os.fdopen(3, "w", buffering=1, closefd=False) as live_f:
          for line in sys.stdin:
              log_f.write(line)
              live_f.write(prefix + line)
      ' "${PACKAGE_NAME}" "${TEMP_LOG_FILE}"
      EXIT_CODE=${PIPESTATUS[0]}

      # Calculate elapsed time and percentage of the target time budget spent on this package.
      ELAPSED_SECONDS=$(( $(date +%s) - START_TIME ))
      BUDGET_MINUTES="${TIME_BUDGET_MINUTES:-20}"
      HARD_LIMIT_MINUTES="${HARD_TIMEOUT_MINUTES:-30}"
      BUDGET_SECONDS=$(( BUDGET_MINUTES * 60 ))
      BUDGET_PERCENTAGE=$(( (ELAPSED_SECONDS * 100 + BUDGET_SECONDS / 2) / BUDGET_SECONDS ))
      BUDGET_MESSAGE=$(printf "Time budget usage: %d%% (%dm %02ds / %dm budget, %dm hard threshold)" \
        "${BUDGET_PERCENTAGE}" "$(( ELAPSED_SECONDS / 60 ))" "$(( ELAPSED_SECONDS % 60 ))" \
        "${BUDGET_MINUTES}" "${HARD_LIMIT_MINUTES}")
      echo "[${PACKAGE_NAME}] ${BUDGET_MESSAGE}" >&3
      echo "${BUDGET_MESSAGE}"

      # Compare actual runtime in minutes against the configured weight in PACKAGE_WEIGHTS
      # (defaulting to 1). Only propose an adjustment when the difference is at least 3 minutes
      # (>= 15% of the 20-minute budget) to avoid noise from normal test runtime variance.
      PROPOSED_WEIGHT=$(( (ELAPSED_SECONDS + 30) / 60 ))
      if [[ ${PROPOSED_WEIGHT} -lt 1 ]]; then
        PROPOSED_WEIGHT=1
      fi
      CONFIGURED_WEIGHT=$(printf '%s\n' "${PACKAGE_WEIGHTS:-}" | awk -F: -v package_name="${PACKAGE_NAME}" '
        { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); gsub(/[[:space:]]/, "", $2) }
        $1 == package_name && $2 != "" { print $2 }
      ' | tail -n 1)
      CONFIGURED_WEIGHT="${CONFIGURED_WEIGHT:-1}"
      WEIGHT_DIFFERENCE=$(( PROPOSED_WEIGHT - CONFIGURED_WEIGHT ))
      if [[ ${WEIGHT_DIFFERENCE} -lt 0 ]]; then
        WEIGHT_DIFFERENCE=$(( -WEIGHT_DIFFERENCE ))
      fi
      if [[ ${WEIGHT_DIFFERENCE} -ge 3 ]]; then
        WEIGHT_MESSAGE="Weight adjustment needed for ${PACKAGE_NAME}: configured=${CONFIGURED_WEIGHT}, proposed=${PROPOSED_WEIGHT} (${PACKAGE_NAME}:${PROPOSED_WEIGHT})"
        echo "[${PACKAGE_NAME}] ${WEIGHT_MESSAGE}" >&3
        echo "${WEIGHT_MESSAGE}"
        echo "  ${PACKAGE_NAME}: ${PROPOSED_WEIGHT}  # was ${CONFIGURED_WEIGHT} (actual: $(( ELAPSED_SECONDS / 60 ))m $(printf '%02d' $(( ELAPSED_SECONDS % 60 )))s)" >> /tmp/cloudbuild_weight_adjustments.txt
      fi

      # Emit failure details to stdout (captured by run_conditional_tests.sh) only when tests fail
      # so passing runs do not print their logs a second time.
      if [[ ${EXIT_CODE} -ne 0 ]]; then
        sed -n '/=== FAILURES ===/,$p' "${TEMP_LOG_FILE}"
      fi
      rm -f "${TEMP_LOG_FILE}"
      exit ${EXIT_CODE}
      EOF
      chmod +x /tmp/cloudbuild_shims/nox

      # Set placeholder credentials for noxfile.py if not already set.
      if [[ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
        export GOOGLE_APPLICATION_CREDENTIALS="CLOUD_BUILD_ADC"
      fi

      # Prepend /tmp/cloudbuild_shims to PATH and PYTHONPATH so our nox wrapper and pytest
      # plugin are picked up automatically by ci/run_single_test.sh and pytest.
      export PATH="/tmp/cloudbuild_shims:${PATH}"
      export PYTHONPATH="/tmp/cloudbuild_shims${PYTHONPATH:+:${PYTHONPATH}}"
      export PYTEST_ADDOPTS="-p cloudbuild_pytest_plugin ${PYTEST_ADDOPTS:-}"

      # Open file descriptor 3 pointing to the container's live stdout so child workers
      # spawned by xargs in ci/run_conditional_tests.sh can stream real-time logs.
      exec 3>&1

      # Export PACKAGE_LIST and delegate execution to the existing monorepo test runner script.
      rm -f /tmp/cloudbuild_weight_adjustments.txt
      CANCEL_WATCHDOG_PID=""
      cleanup_on_exit() {
        # Stop the background cancellation watchdog so it never keeps the build container open.
        if [[ -n "${CANCEL_WATCHDOG_PID}" ]]; then
          kill "${CANCEL_WATCHDOG_PID}" 2>/dev/null || true
        fi
        echo ""
        echo "============================================================"
        if [[ -s /tmp/cloudbuild_weight_adjustments.txt ]]; then
          echo "⚠️  WEIGHT ADJUSTMENTS NEEDED (drifted >= 3m from configured weight):"
          sort -u /tmp/cloudbuild_weight_adjustments.txt
        else
          echo "✅ WEIGHT SUMMARY: No weight adjustments needed (all packages within 2m of configured weight)."
        fi
        echo "============================================================"
      }
      trap cleanup_on_exit EXIT

      # Run a background watchdog that self-cancels this build if a newer commit is pushed
      # to the same PR while all Cloud Build worker slots are occupied.
      python3 ci/cancel_superseded_builds.py --watch &
      CANCEL_WATCHDOG_PID=$!

      export PACKAGE_LIST
      echo "=== System Shard ${SHARD_INDEX}/${MAX_SHARDS} running ${NOX_SESSION} for: ${PACKAGE_LIST} ==="
      ./ci/run_conditional_tests.sh

# Hard 30-minute (1800s) CI timeout ceiling.
timeout: 1800s

substitutions:
  _MAX_SHARDS: '5'
  _SHARD_INDEX: '0'
  _MIN_SHARD_WEIGHT: '10'
  _PARALLEL_WORKERS: '4'
  _TIME_BUDGET_MINUTES: '20'
  _HARD_TIMEOUT_MINUTES: '30'
  _BUILD_TYPE: 'presubmit'
  _BASE_BRANCH: 'main'
  _TEST_ALL_PACKAGES: 'false'
  _DISABLED_PACKAGES: ''
  _FIRESTORE_PROJECT_ID: ''
  _NOX_SESSION: 'system-3.12'
  _PACKAGE_WEIGHTS: |
    bigquery-magics: 2
    gapic-generator: 5
    google-auth: 5
    google-cloud-bigquery: 8
    google-cloud-bigquery-storage: 8
    google-cloud-bigtable: 8
    google-cloud-compute: 8
    google-cloud-datastore: 8
    google-cloud-dns: 1
    google-cloud-error-reporting: 1
    google-cloud-firestore: 8
    google-cloud-logging: 10
    google-cloud-ndb: 12
    google-cloud-pubsub: 15
    google-cloud-spanner: 17
    google-cloud-storage: 7
    google-resumable-media: 1
    pandas-gbq: 12
    sqlalchemy-bigquery: 11

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/gapic-generator-ads-env/versions/latest
      env: 'GAPIC_GENERATOR_ADS_ENV'
    - versionName: projects/$PROJECT_ID/secrets/gapic-generator-service-account/versions/latest
      env: 'GAPIC_GENERATOR_SERVICE_ACCOUNT_JSON'
    - versionName: projects/$PROJECT_ID/secrets/google-auth-service-account/versions/latest
      env: 'GOOGLE_AUTH_SERVICE_ACCOUNT_JSON'
    - versionName: projects/$PROJECT_ID/secrets/google-auth-authorized-user/versions/latest
      env: 'GOOGLE_AUTH_AUTHORIZED_USER_JSON'
