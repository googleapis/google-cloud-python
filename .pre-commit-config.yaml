repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
-   repo: local
    hooks:
    -   id: ruff-check
        name: ruff check (monorepo)
        entry: python ci/run_ruff.py check
        language: python
        additional_dependencies: ['ruff==0.14.14']
        types: [python]
        require_serial: true
    -   id: ruff-format
        name: ruff format (monorepo)
        entry: python ci/run_ruff.py format
        language: python
        additional_dependencies: ['ruff==0.14.14']
        types: [python]
        require_serial: true
